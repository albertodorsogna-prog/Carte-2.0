<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">

<body>
    <div id="error-box">
        <strong>Attenzione:</strong> Si è verificato un imprevisto.<br>
        <span id="error-msg"></span>
    </div>
    <div id="root"></div>
    <script>
        window.onerror = function (message) {
            var box = document.getElementById('error-box');
            var msg = document.getElementById('error-msg');
            if (box && msg) { box.style.display = 'block'; msg.innerText = message; }
        };
    </script>

</body>
