            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {

                [copy[i], copy[j]] = [copy[j], copy[i]];

                            id: `${v}${s.id}`,
                            deckStyle: 'NAP',
                            rank: rankLabel,
                            value: v,
                            suit: s.id,
                            suitName: s.name,
                            symbol: s.symbol,
                            figureIcon,
                            color: s.color,
                            isSettebello: v === 7 && s.id === 'D',
                            isMatta: v === 10 && s.id === 'D'
                        });
                    }
                }
                return shuffleArray(deck);
            }

            const numDecks = meta.deckType === 'FRENCH_108' ? 2 : 1;
            const ranks = [
                { label: '2', value: 2 },
                { label: '3', value: 3 },
                { label: '4', value: 4 },
                { label: '5', value: 5 },
                { label: '6', value: 6 },
                { label: '7', value: 7 },
                { label: '8', value: 8 },
                { label: '9', value: 9 },
                { label: '10', value: 10 },
                { label: 'J', value: 11 },
                { label: 'Q', value: 12 },
                { label: 'K', value: 13 },
                { label: 'A', value: 14 }
            ].filter(r => !(gameId === 'POKER_ITA' && shortItalianPoker && r.value < 7));

            const deck = [];
            for (let d = 0; d < numDecks; d++) {
                for (const s of FRENCH_SUITS) {
                    for (const r of ranks) {
                        deck.push({
                            uid: `FR_${d}_${r.label}${s.id}_${Math.random().toString(36).slice(2, 6)}`,
                            id: `${r.label}${s.id}`,
                            deckStyle: 'FRENCH',
                            rank: r.label,
                            value: r.value,
                            suit: s.id,
                            suitName: s.name,
                            symbol: s.symbol,
                            color: s.color,
                            isPinella: r.value === 2,
                            isJoker: false
                        });
                    }
                }
            }

            if (meta.deckType === 'FRENCH_108') {
                for (let j = 1; j <= 4; j++) {
                    deck.push({
                        uid: `JOKER_${j}_${Math.random().toString(36).slice(2, 6)}`,
                        id: `JOKER_${j}`,
                        deckStyle: 'FRENCH',
                        rank: 'JOK',
                        value: 25,
                        suit: 'J',
                        suitName: 'Jolly',
                        symbol: '🃏',
                        color: j % 2 === 0 ? 'text-red-600' : 'text-purple-800',
                        isPinella: false,
                        isJoker: true
                    });
                }
            }
            return shuffleArray(deck);
        };

        const formatMoney = (amount) => {
            const num = Number(amount) || 0;
            return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);
        };
        const roundCents = (val) => Math.round((Number(val) + Number.EPSILON) * 100) / 100;

        const rankToName = (val) => {
            if (val === 14) return 'Assi';
            if (val === 13) return 'Re (K)';
            if (val === 12) return 'Donne (Q)';
            if (val === 11) return 'Fanti (J)';
            return String(val);
        };

        const evaluate5CardPoker = (cards5) => {
            if (!cards5 || cards5.length < 5) return { score: 0, label: 'In attesa...' };
            const sorted = [...cards5].sort((a, b) => b.value - a.value);
            const values = sorted.map(c => c.value);
            const suits = sorted.map(c => c.suit);
            const isFlush = suits.every(s => s === suits[0]);

            let isStraight = false;
            let straightHigh = values[0];
            const uniqueVals = [...new Set(values)];
            if (uniqueVals.length === 5) {
                if (values[0] - values[4] === 4) isStraight = true;
                else if (values[0] === 14 && values[1] === 5 && values[4] === 2) { isStraight = true; straightHigh = 5; }
                else if (values[0] === 14 && values[1] === 10 && values[4] === 7) { isStraight = true; straightHigh = 10; }
            }

            const counts = {};
            for (const v of values) counts[v] = (counts[v] || 0) + 1;
            const groups = Object.entries(counts)
                .map(([val, count]) => ({ val: Number(val), count }))
                .sort((a, b) => b.count - a.count || b.val - a.val);

            const encodeTie = (arr) => arr.reduce((acc, v, idx) => acc + v * Math.pow(15, 4 - idx), 0);

            if (isStraight && isFlush) return { score: 8e7 + straightHigh, label: straightHigh === 14 ? 'Scala Reale!' : 'Scala Colore' };
            if (groups[0].count === 4) return { score: 7e7 + encodeTie([groups[0].val, groups[1].val]), label: `Poker di ${rankToName(groups[0].val)}` };
            if (groups[0].count === 3 && groups[1].count === 2) return { score: 6e7 + encodeTie([groups[0].val, groups[1].val]), label: `Full (${rankToName(groups[0].val)} e ${rankToName(groups[1].val)})` };
            if (isFlush) return { score: 5e7 + encodeTie(values), label: 'Colore' };
            if (isStraight) return { score: 4e7 + straightHigh, label: 'Scala' };
            if (groups[0].count === 3) return { score: 3e7 + encodeTie(groups.map(g => g.val)), label: `Tris di ${rankToName(groups[0].val)}` };
            if (groups[0].count === 2 && groups[1].count === 2) return { score: 2e7 + encodeTie(groups.map(g => g.val)), label: `Doppia Coppia (${rankToName(groups[0].val)} e ${rankToName(groups[1].val)})` };
            if (groups[0].count === 2) return { score: 1e7 + encodeTie(groups.map(g => g.val)), label: `Coppia di ${rankToName(groups[0].val)}` };
            return { score: encodeTie(values), label: `Carta Alta ${rankToName(values[0])}` };
        };

        const evaluateBestPokerHand = (allCards) => {
            if (!allCards || allCards.length === 0) return { score: 0, label: '' };
            if (allCards.length < 5) {
                if (allCards.length === 2) {
                    if (allCards[0].value === allCards[1].value) return { score: 100 + allCards[0].value, label: `Coppia di ${rankToName(allCards[0].value)}` };
                    const hi = Math.max(allCards[0].value, allCards[1].value);
                    return { score: hi, label: `Carta Alta ${rankToName(hi)}` };
                }
                return { score: 0, label: 'In corso...' };
            }
            if (allCards.length === 5) return evaluate5CardPoker(allCards);

            let best = { score: -1, label: '' };
            const n = allCards.length;
            const pick = (start, chosen) => {
                if (chosen.length === 5) {
                    const res = evaluate5CardPoker(chosen);
                    if (res.score > best.score) best = res;
                    return;
                }
                for (let i = start; i < n; i++) {
                    chosen.push(allCards[i]);
                    pick(i + 1, chosen);
                    chosen.pop();
                }
            };
            pick(0, []);
            return best;
        };

        const evaluateSetteMezzo = (cards, mattaCustomVal = 'AUTO') => {
            if (!cards || cards.length === 0) return { total: 0, busted: false, isRoyal: false, hasMatta: false };
            let baseSum = 0;
            let hasMatta = false;
            for (const c of cards) {
                if (c.isMatta) hasMatta = true;
                else if (c.value >= 8) baseSum += 0.5;
                else baseSum += c.value;
            }

            let mattaVal = 0;
            if (hasMatta) {
                if (mattaCustomVal !== 'AUTO' && mattaCustomVal !== undefined && mattaCustomVal !== null) {
                    mattaVal = Number(mattaCustomVal);
                } else {
                    const candidates = [7, 6, 5, 4, 3, 2, 1, 0.5];
                    mattaVal = 0.5;
                    for (const cand of candidates) {
                        if (baseSum + cand <= 7.5) {
                            mattaVal = cand;
                            break;
                        }
                    }
                }
            }

            const total = Math.round((baseSum + mattaVal) * 10) / 10;
            const isRoyal = cards.length === 2 && total === 7.5 && cards.every(c => c.suit === 'D');
            return { total, mattaVal, hasMatta, busted: total > 7.5, isRoyal };
        };

        const evaluateBlackjack = (cards) => {
            if (!cards || cards.length === 0) return { total: 0, busted: false, isBlackjack: false };
            let total = 0;
            let aces = 0;
            for (const c of cards) {
                if (c.value === 14) { aces += 1; total += 11; }
                else if (c.value >= 10) total += 10;
                else total += c.value;
            }
            while (total > 21 && aces > 0) {
                total -= 10;
                aces -= 1;
            }
            return { total, busted: total > 21, isBlackjack: cards.length === 2 && total === 21 };
        };

        const getBriscolaPoints = (val) => ({ 1: 11, 3: 10, 10: 4, 9: 3, 8: 2 }[val] || 0);
        const getBriscolaStrength = (val) => ({ 1: 10, 3: 9, 10: 8, 9: 7, 8: 6, 7: 5, 6: 4, 5: 3, 4: 2, 2: 1 }[val] || 0);
        const getTressetteThirds = (val) => (val === 1 ? 3 : [2, 3, 8, 9, 10].includes(val) ? 1 : 0);
        const getTressetteStrength = (val) => ({ 3: 10, 2: 9, 1: 8, 10: 7, 9: 6, 8: 5, 7: 4, 6: 3, 5: 2, 4: 1 }[val] || 0);

        const calculateMeldPoints = (cards) => {
            if (!cards) return 0;
            return cards.reduce((sum, c) => {
                if (c.isJoker) return sum + 25;
                if (c.value === 14) return sum + 11;
                if (c.value >= 10) return sum + 10;
                return sum + c.value;
            }, 0);
        };

        const computeScopaBreakdown = (players) => {
            if (!players || players.length === 0) return [];
            const primieraTable = { 7: 21, 6: 18, 1: 16, 5: 15, 4: 14, 3: 13, 2: 12, 8: 10, 9: 10, 10: 10 };

            const stats = players.map(p => {
                const cap = p.capturedCards || [];
                const denariCount = cap.filter(c => c.suit === 'D').length;
                const hasSettebello = cap.some(c => c.isSettebello);
                let primieraScore = 0;
                for (const s of ['D', 'C', 'S', 'B']) {
                    const bestInSuit = Math.max(0, ...cap.filter(c => c.suit === s).map(c => primieraTable[c.value] || 0));
                    primieraScore += bestInSuit;
                }
                return {
                    id: p.id,
                    name: p.name,
                    totalCards: cap.length,
                    denariCount,
                    hasSettebello,
                    primieraScore,
                    scope: p.scopaCount || 0,
                    bonusPoints: 0
                };
            });

            const awardUniqueMax = (key) => {
                const maxVal = Math.max(...stats.map(s => s[key]));
                if (maxVal <= 0) return;
                const leaders = stats.filter(s => s[key] === maxVal);
                if (leaders.length === 1) leaders[0].bonusPoints += 1;
            };

            awardUniqueMax('totalCards');
            awardUniqueMax('denariCount');
            awardUniqueMax('primieraScore');
            stats.forEach(s => {
                if (s.hasSettebello) s.bonusPoints += 1;
                s.finalTotal = s.scope + s.bonusPoints;
            });

            return stats;
        };

        // ============================================================================

        const PlayingCard = ({ card, hidden = false, size = 'md', selected = false, onClick = null, badge = null, disabled = false }) => {

        // ============================================================================
        // 4. COMPONENTE PRINCIPALE: OSTERIA DELLE CARTE, POKER & LUPUS IN TABULA

            const [gameState, setGameState] = useState({

            // Riferimenti Canali di Rete: MQTT Cloud WebSocket + PeerJS + BroadcastChannel
            const mqttClientsRef = useRef([]);

            // ============================================================================
            // 5. PROTEZIONE ANTI-RICARICAMENTO PAGINA PER L'OSTE
            // ============================================================================
            useEffect(() => {
                const handleBeforeUnload = (e) => {

            useEffect(() => {

            const clearSavedHostBackup = () => {

                    localStorage.removeItem(STORAGE_HOST_KEY);
                } catch (e) {}
                setSavedHostBackup(null);
            };

            const activePerspectiveId = useMemo(() => {
                if (!isHost) return myPeerId;

                if (autoFollowTurn && turnP?.isLocalSim && gameState.gameId !== 'LUPUS') {

                return myPeerId;
            }, [isHost, myPeerId, viewedPlayerId, autoFollowTurn, gameState.turnIndex, gameState.players, gameState.gameId]);

            useEffect(() => {
                setSelectedHandIndices([]);
                setSelectedTableCardIds([]);
            }, [activePerspectiveId, gameState.handNumber, gameState.phase, gameState.gameId]);

            // ============================================================================
            // 6. MOTORE MULTIPLAYER TRIPLO CANALE (MQTT CLOUD WEBSOCKET + PEERJS + BC)
            // ============================================================================
            const closeAllMqttClients = () => {
                mqttClientsRef.current.forEach(cl => {
                    try { cl.end(true); } catch (e) {}
                });
                mqttClientsRef.current = [];
            };

            const publishToMqttTopic = (topic, payloadObj) => {
                const raw = JSON.stringify(payloadObj);
                mqttClientsRef.current.forEach(cl => {
                    if (cl && cl.connected) {
                        try {
                            cl.publish(topic, raw, { qos: 0 });
                        } catch (e) {}
                    }
                });
            };

            const broadcastState = (newState) => {
                setGameState(newState);
                gameStateRef.current = newState;
                const code = newState.roomCode || roomCode;

                // 1. Invia su Cloud Relay MQTT WebSocket (raggiunge sempre 4G/5G e Wi-Fi)
                publishToMqttTopic(`osteria_v4_room_${code}_sync`, {
                    type: 'SYNC_STATE',
                    state: newState
                });

                // 2. Invia su BroadcastChannel (schede stesso PC)
                if (bcRef.current) {
                    try {
                        bcRef.current.postMessage({ type: 'SYNC_STATE', state: newState });
                    } catch (e) {}
                }

                // 3. Invia su PeerJS WebRTC
                connectionsRef.current.forEach(conn => {
                    if (conn && conn.open) {
                        try {
                            conn.send({ type: 'SYNC_STATE', state: newState });
                        } catch (e) {}
                    }
                });
            };

            const sendActionToHost = (action) => {
                if (isHost) {
                    processHostAction(action);
                } else {
                    const code = gameStateRef.current.roomCode || roomCode;
                    // 1. Invia via Cloud Relay MQTT WebSocket
                    publishToMqttTopic(`osteria_v4_room_${code}_host`, {
                        type: 'PLAYER_ACTION',
                        action
                    });
                    // 2. Invia via PeerJS
                    if (hostConnRef.current && hostConnRef.current.open) {
                        try {
                            hostConnRef.current.send({ type: 'PLAYER_ACTION', action });
                        } catch (e) {}
                    }
                    // 3. Invia via BroadcastChannel
                    if (bcRef.current) {
                        try {
                            bcRef.current.postMessage({ type: 'PLAYER_ACTION', action });
                        } catch (e) {}
                    }
                }
            };

            // Avvia i canali di rete dell'Oste (MQTT Cloud Relay + PeerJS + BroadcastChannel)
            const setupHostNetworkChannels = (code) => {
                // A. BroadcastChannel locale
                if (bcRef.current) {
                    try { bcRef.current.close(); } catch (e) {}
                }
                const bc = new BroadcastChannel('osteria_room_' + code);
                bc.onmessage = (ev) => {
                    const data = ev.data;
                    if (!data) return;
                    if (data.type === 'JOIN_REQUEST') {
                        handleIncomingJoinRequest(data.playerId, data.playerName, (reply) => {
                            try { bc.postMessage(reply); } catch (e) {}
                        });
                    } else if (data.type === 'PLAYER_ACTION') {
                        processHostAction(data.action);
                    } else if (data.type === 'PING_STATE') {
                        try { bc.postMessage({ type: 'SYNC_STATE', state: gameStateRef.current }); } catch (e) {}
                    }
                };
                bcRef.current = bc;

                // B. Canale Principale Cloud Relay (MQTT over WebSockets su 2 broker in parallelo)
                closeAllMqttClients();
                if (window.mqtt) {
                    const hostTopic = `osteria_v4_room_${code}_host`;
                    const syncTopic = `osteria_v4_room_${code}_sync`;

                    MQTT_BROKERS.forEach((brokerUrl) => {
                        try {
                            const client = window.mqtt.connect(brokerUrl, {
                                clean: true,
                                connectTimeout: 5000,
                                reconnectPeriod: 2000
                            });

                            client.on('connect', () => {
                                client.subscribe(hostTopic);
                                setConnectionStatus(`Cloud Online Attivo • Stanza: ${code}`);
                            });

                            client.on('message', (topic, messageBuffer) => {
                                if (topic !== hostTopic) return;
                                try {
                                    const data = JSON.parse(messageBuffer.toString());
                                    if (data.type === 'JOIN_REQUEST') {
                                        handleIncomingJoinRequest(data.playerId, data.playerName, (reply) => {
                                            publishToMqttTopic(syncTopic, reply);
                                        });
                                    } else if (data.type === 'PLAYER_ACTION') {
                                        processHostAction(data.action);
                                    } else if (data.type === 'PING_STATE') {
                                        publishToMqttTopic(syncTopic, {
                                            type: 'SYNC_STATE',
                                            state: gameStateRef.current
                                        });
                                    }
                                } catch (e) {}
                            });

                            mqttClientsRef.current.push(client);
                        } catch (e) {}
                    });
                }

                // C. Canale Secondario PeerJS WebRTC
                if (window.Peer) {
                    try {
                        if (peerRef.current) peerRef.current.destroy();
                        const peer = new window.Peer('osteria-p2p-' + code, PEER_ICE_CONFIG);
                        peerRef.current = peer;

                        peer.on('open', () => {
                            setConnectionStatus(`Online (Cloud + P2P) • Stanza: ${code}`);
                        });

                        peer.on('connection', (conn) => {
                            connectionsRef.current = [
                                ...connectionsRef.current.filter(c => c !== conn),
                                conn
                            ];
                            conn.on('data', (data) => {
                                if (!data) return;
                                if (data.type === 'JOIN_REQUEST') {
                                    conn.playerId = data.playerId;
                                    handleIncomingJoinRequest(data.playerId, data.playerName, (reply) => {
                                        try { conn.send(reply); } catch (e) {}
                                    });
                                } else if (data.type === 'PLAYER_ACTION') {
                                    processHostAction(data.action);
                                } else if (data.type === 'PING_STATE') {
                                    try { conn.send({ type: 'SYNC_STATE', state: gameStateRef.current }); } catch (e) {}
                                }
                            });
                        });
                    } catch (e) {}
                }
            };

            const handleIncomingJoinRequest = (playerId, rawName, sendDirectReply) => {
                const current = { ...gameStateRef.current };
                const cleanName = (rawName || '').trim();

                if (!cleanName) {
                    sendDirectReply({
                        type: 'JOIN_REJECTED',
                        targetId: playerId,
                        reason: 'Inserisci un nome valido prima di entrare nella stanza!'
                    });
                    return;
                }

                const existingById = current.players.find(p => p.id === playerId);
                if (existingById) {
                    const duplicateOther = current.players.find(
                        p => p.id !== playerId && p.name.trim().toLowerCase() === cleanName.toLowerCase()
                    );
                    if (duplicateOther) {
                        sendDirectReply({
                            type: 'JOIN_REJECTED',
                            targetId: playerId,
                            reason: `Il nome "${cleanName}" è già utilizzato nella stanza! Scegli un nome diverso.`
                        });
                        return;
                    }
                    existingById.name = cleanName;
                    sendDirectReply({ type: 'JOIN_ACCEPTED', targetId: playerId, state: current });
                    broadcastState(current);
                    return;
                }

                const nameAlreadyTaken = current.players.some(
                    p => p.name.trim().toLowerCase() === cleanName.toLowerCase()
                );
                if (nameAlreadyTaken) {
                    sendDirectReply({
                        type: 'JOIN_REJECTED',
                        targetId: playerId,
                        reason: `Il nome "${cleanName}" è già presente nella stanza! Cambia il tuo nome per entrare.`
                    });
                    return;
                }

                const newPlayer = {
                    id: playerId,
                    name: cleanName,
                    isHostPlayer: false,
                    isLocalSim: false,
                    chips: roundCents(current.startChips),
                    currentBet: 0,
                    isFolded: current.phase !== 'WAITING',
                    isActive: true,
                    justWon: false,
                    cards: [],
                    showCards: false,
                    hasActed: false,
                    drawStatus: null,
                    capturedCards: [],
                    scopaCount: 0,
                    scorePoints: 0,
                    scoreThirds: 0,
                    hasTakenPozzetto: false,
                    mattaValue: 'AUTO',
                    hasStood: false,
                    isBusted: false,
                    lupusRole: 'CONTADINO',
                    isAlive: true
                };

                const updatedState = {
                    ...current,
                    players: [...current.players, newPlayer],
                    notification: `🎉 ${cleanName} è entrato nella stanza!`
                };

                sendDirectReply({ type: 'JOIN_ACCEPTED', targetId: playerId, state: updatedState });
                broadcastState(updatedState);
            };

            const handleCreateRoom = () => {
                const cleanName = myName.trim();
                if (!cleanName) {
                    setLobbyError('Inserisci il tuo nome prima di creare la stanza!');
                    return;
                }
                setLobbyError('');
                setKickedMessage('');

                const generatedCode = (roomCode.trim() || Math.random().toString(36).substring(2, 7)).toUpperCase();
                setRoomCode(generatedCode);
                setIsHost(true);
                setViewedPlayerId(myPeerId);

                const hostOnlyPlayer = {
                    id: myPeerId,
                    name: cleanName,
                    isHostPlayer: true,
                    isLocalSim: false,
                    chips: roundCents(gameState.startChips),
                    currentBet: 0,
                    isFolded: false,
                    isActive: true,
                    justWon: false,
                    cards: [],
                    showCards: false,
                    hasActed: false,
                    drawStatus: null,
                    capturedCards: [],
                    scopaCount: 0,
                    scorePoints: 0,
                    scoreThirds: 0,
                    hasTakenPozzetto: false,
                    mattaValue: 'AUTO',
                    hasStood: false,
                    isBusted: false,
                    lupusRole: 'CONTADINO',
                    isAlive: true
                };

                const initialState = {
                    ...gameState,
                    roomCode: generatedCode,
                    phase: 'WAITING',
                    handNumber: 0,
                    pot: 0,
                    communityCards: [],
                    trickCards: [],
                    tableMelds: [],
                    players: [hostOnlyPlayer],
                    notification: `Stanza ${generatedCode} creata! Invita i tuoi amici col codice ${generatedCode}.`
                };

                setGameState(initialState);
                gameStateRef.current = initialState;
                setupHostNetworkChannels(generatedCode);
                setScreen('TABLE');
            };

            const handleRestoreSavedHostGame = () => {
                if (!savedHostBackup || !savedHostBackup.state) return;
                const restored = savedHostBackup.state;
                const code = restored.roomCode || 'OSTE1';

                const updatedPlayers = restored.players.map((p, idx) =>
                    idx === 0 || p.isHostPlayer ? { ...p, id: myPeerId } : p
                );
                const finalRestored = {
                    ...restored,
                    players: updatedPlayers,
                    notification: `🛡️ Partita dell'Oste ripristinata con successo (Codice: ${code})!`
                };

                setMyName(savedHostBackup.hostName || updatedPlayers[0]?.name || 'Oste');
                setRoomCode(code);
                setIsHost(true);
                setViewedPlayerId(myPeerId);
                setGameState(finalRestored);
                gameStateRef.current = finalRestored;

                setupHostNetworkChannels(code);
                setScreen('TABLE');
            };

            // INGRESSO CLIENT ULTRA-AFFIDABILE (Cloud MQTT WebSocket + PeerJS + BroadcastChannel)
            const handleJoinRoom = () => {
                const code = joinCodeInput.trim().toUpperCase();
                const cleanName = myName.trim();

                if (!cleanName) {
                    setLobbyError('Inserisci il tuo nome prima di premere ENTRA!');
                    return;
                }
                if (!code) {
                    setLobbyError('Inserisci il Codice Stanza comunicato dall\'Oste!');
                    return;
                }

                setLobbyError('');
                setKickedMessage('');
                setIsJoining(true);
                setRoomCode(code);
                setIsHost(false);
                setViewedPlayerId(myPeerId);
                setConnectionStatus(`Accesso alla stanza ${code}...`);

                if (joinRetryTimerRef.current) clearInterval(joinRetryTimerRef.current);

                let hasEntered = false;
                const finishJoinSuccess = (incomingState) => {
                    if (hasEntered) return;
                    hasEntered = true;
                    if (joinRetryTimerRef.current) clearInterval(joinRetryTimerRef.current);
                    setIsJoining(false);
                    setLobbyError('');
                    setGameState(incomingState);
                    gameStateRef.current = incomingState;
                    setConnectionStatus(`Connesso a ${code}`);
                    setScreen('TABLE');
                };

                const finishJoinRejected = (reason) => {
                    hasEntered = true;
                    if (joinRetryTimerRef.current) clearInterval(joinRetryTimerRef.current);
                    setIsJoining(false);
                    setLobbyError(reason || 'Accesso rifiutato dalla stanza.');
                    setConnectionStatus('Accesso rifiutato');
                };

                const handleIncomingSyncOrReply = (data) => {
                    if (!data) return;
                    if (data.type === 'JOIN_REJECTED' && data.targetId === myPeerId) {
                        finishJoinRejected(data.reason);
                        return;
                    }
                    if (data.type === 'JOIN_ACCEPTED' && data.targetId === myPeerId) {
                        finishJoinSuccess(data.state);
                        return;
                    }
                    if (data.type === 'KICKED' && data.targetId === myPeerId) {
                        setKickedMessage('Sei stato rimosso dalla stanza dall\'Oste.');
                        setScreen('LOBBY');
                        setIsJoining(false);
                        return;
                    }
                    if (data.type === 'SYNC_STATE' && data.state) {
                        const amIInList = data.state.players.some(p => p.id === myPeerId);
                        if (amIInList) {
                            finishJoinSuccess(data.state);
                            setGameState(data.state);
                            gameStateRef.current = data.state;
                        } else if (screenRef.current === 'TABLE') {
                            setKickedMessage('Sei stato rimosso dalla stanza dall\'Oste.');
                            setScreen('LOBBY');
                        }
                    }
                };

                // 1. Canale Cloud Relay MQTT WebSocket (Passa qualsiasi 4G/5G/Firewall)
                closeAllMqttClients();
                const hostTopic = `osteria_v4_room_${code}_host`;
                const syncTopic = `osteria_v4_room_${code}_sync`;

                if (window.mqtt) {
                    MQTT_BROKERS.forEach((brokerUrl) => {
                        try {
                            const client = window.mqtt.connect(brokerUrl, {
                                clean: true,
                                connectTimeout: 5000,
                                reconnectPeriod: 2000
                            });

                            client.on('connect', () => {
                                client.subscribe(syncTopic, () => {
                                    client.publish(
                                        hostTopic,
                                        JSON.stringify({
                                            type: 'JOIN_REQUEST',
                                            playerId: myPeerId,
                                            playerName: cleanName
                                        })
                                    );
                                });
                            });

                            client.on('message', (topic, messageBuffer) => {
                                if (topic !== syncTopic) return;
                                try {
                                    const data = JSON.parse(messageBuffer.toString());
                                    handleIncomingSyncOrReply(data);
                                } catch (e) {}
                            });

                            mqttClientsRef.current.push(client);
                        } catch (e) {}
                    });
                }

                // 2. BroadcastChannel (Multi-scheda locale)
                if (bcRef.current) {
                    try { bcRef.current.close(); } catch (e) {}
                }
                const bc = new BroadcastChannel('osteria_room_' + code);
                bc.onmessage = (ev) => handleIncomingSyncOrReply(ev.data);
                bcRef.current = bc;
                bc.postMessage({ type: 'JOIN_REQUEST', playerId: myPeerId, playerName: cleanName });

                // 3. PeerJS WebRTC + Retry ogni 1,1 secondi
                let attempts = 0;
                const maxAttempts = 10;

                const sendAllJoinRequests = () => {
                    if (hasEntered) return;
                    attempts += 1;

                    publishToMqttTopic(hostTopic, {
                        type: 'JOIN_REQUEST',
                        playerId: myPeerId,
                        playerName: cleanName
                    });

                    try {
                        bc.postMessage({ type: 'JOIN_REQUEST', playerId: myPeerId, playerName: cleanName });
                    } catch (e) {}

                    if (window.Peer) {
                        try {
                            if (!peerRef.current || peerRef.current.destroyed) {
                                peerRef.current = new window.Peer(undefined, PEER_ICE_CONFIG);
                            }
                            const peer = peerRef.current;
                            const tryPeerConn = () => {
                                if (hasEntered) return;
                                if (hostConnRef.current && hostConnRef.current.open) {
                                    hostConnRef.current.send({ type: 'JOIN_REQUEST', playerId: myPeerId, playerName: cleanName });
                                    return;
                                }
                                const conn = peer.connect('osteria-p2p-' + code, { reliable: true });
                                hostConnRef.current = conn;
                                conn.on('open', () => {
                                    conn.send({ type: 'JOIN_REQUEST', playerId: myPeerId, playerName: cleanName });
                                });
                                conn.on('data', (data) => handleIncomingSyncOrReply(data));
                            };
                            if (peer.open) tryPeerConn();
                            else peer.once('open', tryPeerConn);
                        } catch (e) {}
                    }
                };

                sendAllJoinRequests();
                joinRetryTimerRef.current = setInterval(() => {
                    if (hasEntered) {
                        clearInterval(joinRetryTimerRef.current);
                        return;
                    }
                    if (attempts >= maxAttempts) {
                        clearInterval(joinRetryTimerRef.current);
                        setIsJoining(false);
                        setLobbyError(
                            `La stanza "${code}" non risponde. Controlla che il codice sia esatto e che l'Oste abbia il tavolo aperto.`
                        );
                        return;
                    }
                    setConnectionStatus(`Ricerca stanza ${code} (${attempts + 1}/${maxAttempts})...`);
                    sendAllJoinRequests();
                }, 1100);
            };

            const handleClientReconnect = () => {
                if (isHost) return;
                const code = gameStateRef.current.roomCode || roomCode;
                publishToMqttTopic(`osteria_v4_room_${code}_host`, {
                    type: 'PING_STATE',
                    playerId: myPeerId
                });
                if (bcRef.current) {
                    try { bcRef.current.postMessage({ type: 'PING_STATE' }); } catch (e) {}
                }
                if (hostConnRef.current && hostConnRef.current.open) {
                    try { hostConnRef.current.send({ type: 'PING_STATE' }); } catch (e) {}
                }
            };

            const handleKickPlayer = (targetPlayerId) => {
                if (!isHost || targetPlayerId === myPeerId) return;
                const current = { ...gameStateRef.current };
                const targetPlayer = current.players.find(p => p.id === targetPlayerId);
                if (!targetPlayer) return;

                const code = current.roomCode || roomCode;
                publishToMqttTopic(`osteria_v4_room_${code}_sync`, {
                    type: 'KICKED',
                    targetId: targetPlayerId
                });

                if (bcRef.current) {
                    try { bcRef.current.postMessage({ type: 'KICKED', targetId: targetPlayerId }); } catch (e) {}
                }
                connectionsRef.current.forEach(conn => {
                    if (conn && conn.open) {
                        try {
                            conn.send({ type: 'KICKED', targetId: targetPlayerId });
                            if (conn.playerId === targetPlayerId) {
                                setTimeout(() => conn.close(), 200);
                            }
                        } catch (e) {}
                    }
                });
                connectionsRef.current = connectionsRef.current.filter(c => c.playerId !== targetPlayerId);

                const remainingPlayers = current.players.filter(p => p.id !== targetPlayerId);
                const safeDealerIdx = remainingPlayers.length > 0 ? current.dealerIndex % remainingPlayers.length : 0;
                const safeTurnIdx = remainingPlayers.length > 0 ? current.turnIndex % remainingPlayers.length : 0;
                const nextPhase = remainingPlayers.length < 2 ? 'WAITING' : current.phase;

                if (viewedPlayerId === targetPlayerId) {
                    setViewedPlayerId(myPeerId);
                }

                broadcastState({
                    ...current,
                    players: remainingPlayers,
                    dealerIndex: safeDealerIdx,
                    turnIndex: safeTurnIdx,
                    phase: nextPhase,
                    notification: `❌ ${targetPlayer.name} è stato rimosso dalla stanza dall'Oste.`
                });
            };

            const handleAddLocalTestPlayer = () => {
                if (!isHost) return;
                const current = { ...gameStateRef.current };
                let baseName = newLocalPlayerName.trim() || `Amico ${current.players.length}`;
                let finalName = baseName;
                let counter = 2;
                while (current.players.some(p => p.name.trim().toLowerCase() === finalName.toLowerCase())) {
                    finalName = `${baseName} ${counter}`;
                    counter++;
                }

                const newPlayer = {
                    id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                    name: finalName,
                    isHostPlayer: false,
                    isLocalSim: true,
                    chips: roundCents(current.startChips),
                    currentBet: 0,
                    isFolded: current.phase !== 'WAITING',
                    isActive: true,
                    justWon: false,
                    cards: [],
                    showCards: false,
                    hasActed: false,
                    drawStatus: null,
                    capturedCards: [],
                    scopaCount: 0,
                    scorePoints: 0,
                    scoreThirds: 0,
                    hasTakenPozzetto: false,
                    mattaValue: 'AUTO',
                    hasStood: false,
                    isBusted: false,
                    lupusRole: 'CONTADINO',
                    isAlive: true
                };
                setNewLocalPlayerName('');
                broadcastState({
                    ...current,
                    players: [...current.players, newPlayer],
                    notification: `👤 ${finalName} si è seduto al tavolo!`
                });
            };

            // ============================================================================
            // 7. DISTRIBUZIONE CARTE E AVVIO PARTITA
            // ============================================================================
            const startNewHand = (overrideGameId = null) => {
                if (!isHost) return;
                const current = { ...gameStateRef.current };
                const gId = overrideGameId || current.gameId;
                const gMeta = GAMES_CATALOG[gId] || GAMES_CATALOG.SCOPA;

                if (current.players.length < 2) {
                    broadcastState({
                        ...current,
                        gameId: gId,
                        phase: 'WAITING',
                        notification: 'Servono almeno 2 giocatori al tavolo per iniziare! Invita gli amici col Codice Stanza o aggiungi giocatori di test.'
                    });
                    return;
                }

                if (gId === 'LUPUS') {
                    const pCount = current.players.length;
                    const cfg = current.lupusConfig || { wolvesCount: 1, hasLycanthrope: true, hasSeer: true, hasGuard: true, hasJester: true };
                    const rolePool = [];

                    const wolvesToAssign = Math.max(1, Math.min(cfg.wolvesCount || 1, Math.floor(pCount / 2)));
                    for (let i = 0; i < wolvesToAssign; i++) rolePool.push('LUPO');

                    if (cfg.hasLycanthrope && rolePool.length < pCount - 1) rolePool.push('LICANTROPO');
                    if (cfg.hasSeer && rolePool.length < pCount) rolePool.push('VEGGENTE');
                    if (cfg.hasGuard && rolePool.length < pCount) rolePool.push('GUARDIA');
                    if (cfg.hasJester && rolePool.length < pCount) rolePool.push('MATTO');

                    while (rolePool.length < pCount) {
                        rolePool.push('CONTADINO');
                    }

                    const shuffledRoles = shuffleArray(rolePool);
                    const updatedPlayers = current.players.map((p, idx) => ({
                        ...p,
                        lupusRole: shuffledRoles[idx],
                        isAlive: true,
                        justWon: false,
                        showCards: false,
                        cards: []
                    }));

                    broadcastState({
                        ...current,
                        gameId: 'LUPUS',
                        handNumber: current.handNumber + 1,
                        phase: 'LUPUS_NIGHT',
                        players: updatedPlayers,
                        lupusState: {
                            dayNumber: 1,
                            subPhase: 'NIGHT',
                            wolfVotes: {},
                            seerTargetId: null,
                            seerResult: null,
                            guardTargetId: null,
                            dayVotes: {},
                            ballotCandidates: [],
                            lastNightReport: '',
                            lastLynchReport: '',
                            winnerTeam: null,
                            winnerBanner: ''
                        },
                        notification: '🌙 NOTTE #1: Il villaggio dorme... Lupi, Veggente e Guardia compiono le loro scelte segrete!'
                    });
                    return;
                }

                const deck = createDeckForGame(gId, current.shortDeck);
                const pCount = current.players.length;
                const nextDealer = current.handNumber === 0 ? 0 : (current.dealerIndex + 1) % pCount;
                const firstActor = (nextDealer + 1) % pCount;

                let communityCards = [];
                let discardPile = [];
                let briscolaCard = null;
                let briscolaSuit = null;
                let pozzetti = [[], []];
                let initialPot = 0;
                let startingPhase = 'PLAYING';
                let cardsPerPlayer = 3;

                if (gId === 'TEXAS') { cardsPerPlayer = 2; startingPhase = 'PREFLOP'; }
                else if (gId === 'POKER_ITA') { cardsPerPlayer = 5; startingPhase = 'BET_1'; }
                else if (gId === 'SCOPA') { cardsPerPlayer = 3; communityCards = deck.splice(0, 4); }
                else if (gId === 'BRISCOLA') {
                    cardsPerPlayer = 3;
                    briscolaCard = deck[deck.length - 1];
                    briscolaSuit = briscolaCard.suit;
                }
                else if (gId === 'TRESSETTE') { cardsPerPlayer = Math.min(10, Math.floor(deck.length / pCount)); }
                else if (gId === 'ZOMPACAVALLO') { cardsPerPlayer = 5; discardPile = [deck.splice(0, 1)[0]]; }
                else if (gId === 'SETTE_MEZZO') { cardsPerPlayer = 1; }
                else if (gId === 'SCALA40' || gId === 'MACHIAVELLI') { cardsPerPlayer = 13; discardPile = [deck.splice(0, 1)[0]]; }
                else if (gId === 'BURRACO') {
                    cardsPerPlayer = 11;
                    pozzetti = [deck.splice(0, 11), deck.splice(0, 11)];
                    discardPile = [deck.splice(0, 1)[0]];
                }
                else if (gId === 'RAMINO') { cardsPerPlayer = 10; discardPile = [deck.splice(0, 1)[0]]; }
                else if (gId === 'BLACKJACK') { cardsPerPlayer = 2; }

                let updatedPlayers = current.players.map((p) => {
                    const dealt = deck.splice(0, cardsPerPlayer);
                    return {
                        ...p,
                        currentBet: 0,
                        isFolded: false,
                        isActive: true,
                        isAlive: true,
                        justWon: false,
                        cards: dealt,
                        showCards: false,
                        hasActed: false,
                        drawStatus: null,
                        capturedCards: [],
                        scopaCount: 0,
                        scorePoints: 0,
                        scoreThirds: 0,
                        hasTakenPozzetto: false,
                        needDrawFirst: ['SCALA40', 'BURRACO', 'RAMINO'].includes(gId),
                        mattaValue: 'AUTO',
                        hasStood: false,
                        isBusted: false
                    };
                });

                let turnIdx = firstActor;

                if (gMeta.category === 'POKER') {
                    const sbIdx = (nextDealer + 1) % pCount;
                    const bbIdx = (sbIdx + 1) % pCount;
                    const sbAmt = Math.min(roundCents(current.smallBlind), updatedPlayers[sbIdx].chips);
                    updatedPlayers[sbIdx].chips = roundCents(updatedPlayers[sbIdx].chips - sbAmt);
                    updatedPlayers[sbIdx].currentBet = sbAmt;

                    const bbAmt = Math.min(roundCents(current.bigBlind), updatedPlayers[bbIdx].chips);
                    updatedPlayers[bbIdx].chips = roundCents(updatedPlayers[bbIdx].chips - bbAmt);
                    updatedPlayers[bbIdx].currentBet = bbAmt;

                    initialPot = roundCents(sbAmt + bbAmt);
                    turnIdx = (bbIdx + 1) % pCount;
                }

                broadcastState({
                    ...current,
                    gameId: gId,
                    handNumber: current.handNumber + 1,
                    phase: startingPhase,
                    pot: initialPot,
                    dealerIndex: nextDealer,
                    turnIndex: turnIdx,
                    deck,
                    discardPile,
                    communityCards,
                    trickCards: [],
                    briscolaCard,
                    briscolaSuit,
                    leadSuit: null,
                    pozzetti,
                    tableMelds: [],
                    players: updatedPlayers,
                    notification: `Mano #${current.handNumber + 1} di ${gMeta.name} iniziata! Tocca a ${updatedPlayers[turnIdx]?.name}.`
                });
            };

            // ============================================================================
            // 8. LOGICA COMPLETA DI LUPUS IN TABULA
            // ============================================================================
            const checkLupusWinCondition = (playersList) => {
                const alive = playersList.filter(p => p.isAlive);
                const aliveWolves = alive.filter(p => p.lupusRole === 'LUPO' || p.lupusRole === 'LICANTROPO');
                const aliveNonWolves = alive.filter(p => p.lupusRole !== 'LUPO' && p.lupusRole !== 'LICANTROPO');

                if (aliveWolves.length === 0) {
                    return {
                        winnerTeam: 'VILLAGE',
                        winnerBanner: '🎉 IL VILLAGGIO HA VINTO! Tutti i Lupi (e il Licantropo) sono stati smascherati!'
                    };
                }
                if (aliveWolves.length >= aliveNonWolves.length) {
                    return {
                        winnerTeam: 'WOLVES',
                        winnerBanner: '🐺 I LUPI MANNARI HANNO VINTO! Hanno raggiunto la parità numerica con gli abitanti del villaggio!'
                    };
                }
                return null;
            };

            const resolveLupusNight = (stateSnapshot) => {
                const ls = { ...stateSnapshot.lupusState };
                const players = [...stateSnapshot.players];

                const voteCounts = {};
                Object.values(ls.wolfVotes || {}).forEach(targetId => {
                    if (targetId) voteCounts[targetId] = (voteCounts[targetId] || 0) + 1;
                });

                let chosenVictimId = null;
                let maxWolfVotes = 0;
                Object.entries(voteCounts).forEach(([tId, cnt]) => {
                    if (cnt > maxWolfVotes) {
                        maxWolfVotes = cnt;
                        chosenVictimId = tId;
                    }
                });

                let nightReport = '☀️ È sorto il sole! Questa notte nessun abitante è stato sbranato.';
                if (chosenVictimId) {
                    const victim = players.find(p => p.id === chosenVictimId);
                    if (victim) {
                        if (ls.guardTargetId && ls.guardTargetId === chosenVictimId) {
                            nightReport = `🛡️ MIRACOLO NELLA NOTTE! I Lupi hanno attaccato ${victim.name}, ma LA GUARDIA l'ha protetto e nessuno è morto!`;
                        } else {
                            victim.isAlive = false;
                            nightReport = `🩸 TRAGEDIA ALL'ALBA! Durante la notte i Lupi hanno sbranato ${victim.name}!`;
                        }
                    }
                }

                const winCheck = checkLupusWinCondition(players);
                if (winCheck) {
                    broadcastState({
                        ...stateSnapshot,
                        phase: 'SHOWDOWN',
                        players: players.map(p => ({ ...p, showCards: true })),
                        lupusState: {
                            ...ls,
                            subPhase: 'GAME_OVER',
                            lastNightReport: nightReport,
                            winnerTeam: winCheck.winnerTeam,
                            winnerBanner: winCheck.winnerBanner
                        },
                        notification: `${nightReport} • ${winCheck.winnerBanner}`
                    });
                    return;
                }

                broadcastState({
                    ...stateSnapshot,
                    phase: 'LUPUS_DAY',
                    players,
                    lupusState: {
                        ...ls,
                        subPhase: 'DAY_DISCUSSION',
                        dayVotes: {},
                        ballotCandidates: [],
                        lastNightReport: nightReport,
                        lastLynchReport: ''
                    },
                    notification: `${nightReport} • Ora inizia la VOTAZIONE GENERALE del Villaggio!`
                });
            };

            const resolveLupusDayVote = (stateSnapshot) => {
                const ls = { ...stateSnapshot.lupusState };
                const players = [...stateSnapshot.players];
                const tally = {};

                Object.values(ls.dayVotes || {}).forEach(targetId => {
                    if (targetId && targetId !== 'SKIP') {
                        tally[targetId] = (tally[targetId] || 0) + 1;
                    }
                });

                let maxVotes = 0;
                Object.values(tally).forEach(cnt => {
                    if (cnt > maxVotes) maxVotes = cnt;
                });

                if (maxVotes === 0) {
                    const nextDay = (ls.dayNumber || 1) + 1;
                    broadcastState({
                        ...stateSnapshot,
                        phase: 'LUPUS_NIGHT',
                        lupusState: {
                            ...ls,
                            dayNumber: nextDay,
                            subPhase: 'NIGHT',
                            wolfVotes: {},
                            seerTargetId: null,
                            seerResult: null,
                            guardTargetId: null,
                            dayVotes: {},
                            ballotCandidates: [],
                            lastLynchReport: '⚖️ Il Villaggio si è astenuto: nessuno è stato eliminato al rogo.'
                        },
                        notification: `🌙 Calano le tenebre (Notte #${nextDay})! Nessun eliminato al rogo.`
                    });
                    return;
                }

                const topIds = Object.keys(tally).filter(id => tally[id] === maxVotes);

                if (topIds.length > 1 && ls.subPhase !== 'DAY_BALLOT') {
                    const tiedNames = topIds
                        .map(id => players.find(p => p.id === id)?.name)
                        .filter(Boolean)
                        .join(', ');

                    broadcastState({
                        ...stateSnapshot,
                        lupusState: {
                            ...ls,
                            subPhase: 'DAY_BALLOT',
                            dayVotes: {},
                            ballotCandidates: topIds,
                            lastLynchReport: `⚖️ PARITÀ DI VOTI (${maxVotes})! Si va al BALLOTTAGGIO decisivo tra: ${tiedNames}!`
                        },
                        notification: `⚖️ BALLOTTAGGIO! Votate solo tra i candidati in parità: ${tiedNames}!`
                    });
                    return;
                }

                if (topIds.length > 1 && ls.subPhase === 'DAY_BALLOT') {
                    const nextDay = (ls.dayNumber || 1) + 1;
                    broadcastState({
                        ...stateSnapshot,
                        phase: 'LUPUS_NIGHT',
                        lupusState: {
                            ...ls,
                            dayNumber: nextDay,
                            subPhase: 'NIGHT',
                            wolfVotes: {},
                            seerTargetId: null,
                            seerResult: null,
                            guardTargetId: null,
                            dayVotes: {},
                            ballotCandidates: [],
                            lastLynchReport: '⚖️ Nuova parità anche al Ballottaggio! Nessuno viene mandato al rogo.'
                        },
                        notification: `🌙 Parità al ballottaggio: nessuno muore! Inizia la Notte #${nextDay}.`
                    });
                    return;
                }

                const eliminatedId = topIds[0];
                const eliminatedPlayer = players.find(p => p.id === eliminatedId);
                if (eliminatedPlayer) {
                    eliminatedPlayer.isAlive = false;
                }

                const roleInfo = LUPUS_ROLES_INFO[eliminatedPlayer?.lupusRole] || LUPUS_ROLES_INFO.CONTADINO;
                const lynchMsg = `🔥 Il Villaggio ha votato (${maxVotes} voti): ${eliminatedPlayer?.name} è stato eliminato al rogo! Era: ${roleInfo.icon} ${roleInfo.name}!`;

                if (eliminatedPlayer?.lupusRole === 'MATTO') {
                    const jesterBanner = `🤪 VITTORIA EPICA DEL MATTO! ${eliminatedPlayer.name} si è fatto eliminare nella Votazione Generale del Villaggio e VINCE LA PARTITA DA SOLO!`;
                    eliminatedPlayer.justWon = true;
                    broadcastState({
                        ...stateSnapshot,
                        phase: 'SHOWDOWN',
                        players: players.map(p => ({ ...p, showCards: true })),
                        lupusState: {
                            ...ls,
                            subPhase: 'GAME_OVER',
                            lastLynchReport: lynchMsg,
                            winnerTeam: 'JESTER',
                            winnerBanner: jesterBanner
                        },
                        notification: jesterBanner
                    });
                    return;
                }

                const winCheck = checkLupusWinCondition(players);
                if (winCheck) {
                    broadcastState({
                        ...stateSnapshot,
                        phase: 'SHOWDOWN',
                        players: players.map(p => ({ ...p, showCards: true })),
                        lupusState: {
                            ...ls,
                            subPhase: 'GAME_OVER',
                            lastLynchReport: lynchMsg,
                            winnerTeam: winCheck.winnerTeam,
                            winnerBanner: winCheck.winnerBanner
                        },
                        notification: `${lynchMsg} • ${winCheck.winnerBanner}`
                    });
                    return;
                }

                const nextDay = (ls.dayNumber || 1) + 1;
                broadcastState({
                    ...stateSnapshot,
                    phase: 'LUPUS_NIGHT',
                    players,
                    lupusState: {
                        ...ls,
                        dayNumber: nextDay,
                        subPhase: 'NIGHT',
                        wolfVotes: {},
                        seerTargetId: null,
                        seerResult: null,
                        guardTargetId: null,
                        dayVotes: {},
                        ballotCandidates: [],
                        lastLynchReport: lynchMsg
                    },
                    notification: `${lynchMsg} • 🌙 Ora scende la Notte #${nextDay}!`
                });
            };

            // ============================================================================
            // 9. MOTORE CENTRALE DELLE AZIONI SULL'HOST
            // ============================================================================
            const findNextActivePokerIndex = (playersList, fromIndex) => {
                const len = playersList.length;
                if (len === 0) return 0;
                let idx = (fromIndex + 1) % len;
                let loops = 0;
                while ((playersList[idx].isFolded || !playersList[idx].isActive || playersList[idx].chips <= 0) && loops < len) {
                    idx = (idx + 1) % len;
                    loops++;
                }
                return idx;
            };

            const moveToNextPokerStreet = (state, prefixMsg = '') => {
                const deck = [...state.deck];
                const resetPlayers = state.players.map(p => ({ ...p, currentBet: 0, hasActed: false }));
                const firstActor = findNextActivePokerIndex(resetPlayers, state.dealerIndex);
                const sep = prefixMsg ? `${prefixMsg} • ` : '';

                if (state.gameId === 'TEXAS') {
                    if (state.phase === 'PREFLOP') {
                        return { ...state, deck, players: resetPlayers, communityCards: deck.splice(0, 3), phase: 'FLOP', turnIndex: firstActor, notification: `${sep}FLOP servito (3 carte comuni)!` };
                    }
                    if (state.phase === 'FLOP') {
                        return { ...state, deck, players: resetPlayers, communityCards: [...state.communityCards, ...deck.splice(0, 1)], phase: 'TURN', turnIndex: firstActor, notification: `${sep}TURN servito (4ª carta)!` };
                    }
                    if (state.phase === 'TURN') {
                        return { ...state, deck, players: resetPlayers, communityCards: [...state.communityCards, ...deck.splice(0, 1)], phase: 'RIVER', turnIndex: firstActor, notification: `${sep}RIVER servito (5ª carta)!` };
                    }
                    return {
                        ...state,
                        players: resetPlayers.map(p => (!p.isFolded ? { ...p, showCards: true } : p)),
                        phase: 'SHOWDOWN',
                        notification: `${sep}SHOWDOWN! Carte scoperte: premi "Calcola Vincitore" o assegna il piatto.`
                    };
                } else {
                    if (state.phase === 'BET_1') {
                        return { ...state, players: resetPlayers, phase: 'DRAW', turnIndex: firstActor, notification: `${sep}FASE CAMBIO CARTE! Tocca fino a 4 carte da cambiare o premi "Servito".` };
                    }
                    if (state.phase === 'DRAW') {
                        return { ...state, players: resetPlayers, phase: 'BET_2', turnIndex: firstActor, notification: `${sep}Cambio carte completato! Ultimo giro di puntate.` };
                    }
                    return {
                        ...state,
                        players: resetPlayers.map(p => (!p.isFolded ? { ...p, showCards: true } : p)),
                        phase: 'SHOWDOWN',
                        notification: `${sep}SHOWDOWN! Confronta i punti o premi "Calcola Vincitore".`
                    };
                }
            };

            const advancePokerTurn = (state, actingIdx, msg) => {
                const activeNonFolded = state.players.filter(p => !p.isFolded && p.isActive);
                if (activeNonFolded.length === 1) {
                    return {
                        ...state,
                        phase: 'SHOWDOWN',
                        notification: `${msg} — Tutti gli altri hanno passato! ${activeNonFolded[0].name} vince il piatto.`
                    };
                }
                const highBet = Math.max(...state.players.map(p => p.currentBet), 0);
                const allMatched = activeNonFolded.every(p => p.chips === 0 || (p.hasActed && Math.abs(p.currentBet - highBet) < 0.005));
                if (!allMatched) {
                    return { ...state, turnIndex: findNextActivePokerIndex(state.players, actingIdx), notification: msg };
                }
                return moveToNextPokerStreet(state, msg);
            };

            const processHostAction = (action) => {
                const current = { ...gameStateRef.current };

                if (action.type === 'TOGGLE_SHOW_CARDS') {
                    const updatedPlayers = current.players.map(p =>
                        p.id === action.playerId ? { ...p, showCards: !p.showCards } : p
                    );
                    const pObj = updatedPlayers.find(p => p.id === action.playerId);
                    broadcastState({
                        ...current,
                        players: updatedPlayers,
                        notification: pObj?.showCards ? `👁️ ${pObj.name} ha mostrato le sue carte/ruolo al tavolo!` : `${pObj?.name} ha coperto le sue carte.`
                    });
                    return;
                }

                if (action.type === 'LUPUS_WOLF_VOTE') {
                    const voter = current.players.find(p => p.id === action.playerId);
                    if (!voter || !voter.isAlive || (voter.lupusRole !== 'LUPO' && voter.lupusRole !== 'LICANTROPO')) return;
                    const newWolfVotes = { ...(current.lupusState.wolfVotes || {}), [action.playerId]: action.targetId };
                    broadcastState({
                        ...current,
                        lupusState: {
                            ...current.lupusState,
                            wolfVotes: newWolfVotes
                        }
                    });
                    return;
                }

                if (action.type === 'LUPUS_SEER_ASK') {
                    const seer = current.players.find(p => p.id === action.playerId);
                    const target = current.players.find(p => p.id === action.targetId);
                    if (!seer || !seer.isAlive || seer.lupusRole !== 'VEGGENTE' || !target) return;

                    const isWolfAppearing = target.lupusRole === 'LUPO';

                    broadcastState({
                        ...current,
                        lupusState: {
                            ...current.lupusState,
                            seerTargetId: target.id,
                            seerResult: {
                                targetId: target.id,
                                targetName: target.name,
                                isWolfAppearing
                            }
                        }
                    });
                    return;
                }

                if (action.type === 'LUPUS_GUARD_PROTECT') {
                    const guard = current.players.find(p => p.id === action.playerId);
                    if (!guard || !guard.isAlive || guard.lupusRole !== 'GUARDIA') return;
                    broadcastState({
                        ...current,
                        lupusState: {
                            ...current.lupusState,
                            guardTargetId: action.targetId
                        }
                    });
                    return;
                }

                if (action.type === 'LUPUS_RESOLVE_NIGHT') {
                    resolveLupusNight(current);
                    return;
                }

                if (action.type === 'LUPUS_DAY_VOTE') {
                    const voter = current.players.find(p => p.id === action.playerId);
                    if (!voter || !voter.isAlive) return;
                    const updatedVotes = {
                        ...(current.lupusState.dayVotes || {}),
                        [action.playerId]: action.targetId
                    };
                    const alivePlayers = current.players.filter(p => p.isAlive);
                    const allAliveVoted = alivePlayers.every(p => updatedVotes[p.id]);

                    const nextState = {
                        ...current,
                        lupusState: {
                            ...current.lupusState,
                            dayVotes: updatedVotes
                        },
                        notification: `🗳️ ${voter.name} ha espresso il suo voto (${Object.keys(updatedVotes).length}/${alivePlayers.length}).`
                    };

                    if (allAliveVoted) {
                        resolveLupusDayVote(nextState);
                    } else {
                        broadcastState(nextState);
                    }
                    return;
                }

                if (action.type === 'LUPUS_FORCE_RESOLVE_DAY') {
                    resolveLupusDayVote(current);
                    return;
                }

                if (action.type === 'SORT_HAND') {
                    const updatedPlayers = current.players.map(p => {
                        if (p.id !== action.playerId) return p;
                        const sorted = [...p.cards].sort((a, b) => {
                            if (action.mode === 'SUIT') return a.suit.localeCompare(b.suit) || a.value - b.value;
                            return a.value - b.value || a.suit.localeCompare(b.suit);
                        });
                        return { ...p, cards: sorted };
                    });
                    broadcastState({ ...current, players: updatedPlayers });
                    return;
                }

                if (action.type === 'REBUY_PLAYER') {
                    const updatedPlayers = current.players.map(p =>
                        p.id === action.playerId ? { ...p, chips: roundCents(p.chips + Number(current.startChips)) } : p
                    );
                    broadcastState({ ...current, players: updatedPlayers, notification: `Ricarica di ${formatMoney(current.startChips)} effettuata!` });
                    return;
                }

                if (action.type === 'POKER_BET') {
                    const idx = current.players.findIndex(p => p.id === action.playerId);
                    if (idx === -1 || idx !== current.turnIndex) return;
                    const p = current.players[idx];
                    let amt = roundCents(parseFloat(action.amount));
                    if (isNaN(amt) || amt < 0) return;
                    if (amt > p.chips) amt = p.chips;

                    const highBet = Math.max(...current.players.map(pl => pl.currentBet), 0);
                    const afterBet = roundCents(p.currentBet + amt);
                    const isAllIn = Math.abs(amt - p.chips) < 0.005;

                    if (afterBet < highBet - 0.005 && !isAllIn) {
                        const needed = roundCents(highBet - p.currentBet);
                        broadcastState({ ...current, notification: `Puntata minima per vedere: ${formatMoney(needed)}!` });
                        return;
                    }

                    const updatedPlayers = current.players.map((pl, i) =>
                        i === idx ? { ...pl, chips: roundCents(pl.chips - amt), currentBet: afterBet, hasActed: true } : pl
                    );
                    const desc = amt === 0 ? `${p.name} fa Check` : isAllIn ? `${p.name} va ALL-IN (${formatMoney(afterBet)})!` : afterBet > highBet + 0.005 ? `${p.name} RILANCIA a ${formatMoney(afterBet)}!` : `${p.name} Vede (${formatMoney(amt)})`;

                    broadcastState(advancePokerTurn({ ...current, players: updatedPlayers, pot: roundCents(current.pot + amt) }, idx, desc));
                    return;
                }

                if (action.type === 'POKER_FOLD') {
                    const idx = current.players.findIndex(p => p.id === action.playerId);
                    if (idx === -1 || idx !== current.turnIndex) return;
                    const p = current.players[idx];
                    const updatedPlayers = current.players.map((pl, i) => (i === idx ? { ...pl, isFolded: true, hasActed: true } : pl));
                    broadcastState(advancePokerTurn({ ...current, players: updatedPlayers }, idx, `${p.name} passa (Fold)`));
                    return;
                }

                if (action.type === 'POKER_DRAW') {
                    const idx = current.players.findIndex(p => p.id === action.playerId);
                    if (idx === -1 || current.phase !== 'DRAW') return;
                    const p = current.players[idx];
                    const indices = action.indices || [];
                    const deck = [...current.deck];
                    const num = Math.min(indices.length, 4, deck.length);
                    const kept = p.cards.filter((_, cIdx) => !indices.includes(cIdx));
                    const drawn = deck.splice(0, num);
                    const badge = num === 0 ? 'Servito!' : `Cambiato ${num}`;

                    const updatedPlayers = current.players.map((pl, i) =>
                        i === idx ? { ...pl, cards: [...kept, ...drawn], hasActed: true, drawStatus: badge } : pl
                    );
                    const allDone = updatedPlayers.filter(pl => !pl.isFolded && pl.isActive).every(pl => pl.hasActed);
                    if (allDone) {
                        broadcastState(moveToNextPokerStreet({ ...current, deck, players: updatedPlayers }, `${p.name}: ${badge}`));
                    } else {
                        const nextIdx = findNextActivePokerIndex(updatedPlayers, idx);
                        broadcastState({ ...current, deck, players: updatedPlayers, turnIndex: nextIdx, notification: `${p.name}: ${badge}` });
                    }
                    return;
                }

                if (action.type === 'SCOPA_PLAY') {
                    const idx = current.players.findIndex(p => p.id === action.playerId);
                    if (idx === -1 || idx !== current.turnIndex) return;
                    const p = current.players[idx];
                    const card = p.cards[action.cardIndex];
                    if (!card) return;

                    let table = [...current.communityCards];
                    let captured = [];

                    const chosenOnTable = table.filter(tc => (action.selectedTableUids || []).includes(tc.uid));
                    const chosenSum = chosenOnTable.reduce((s, c) => s + c.value, 0);
                    const exactMatch = table.find(tc => tc.value === card.value);

                    if (exactMatch) {
                        captured = [exactMatch];
                    } else if (chosenOnTable.length > 0 && chosenSum === card.value) {
                        captured = chosenOnTable;
                    } else {
                        const findSubset = (arr, target) => {
                            let result = null;
                            const search = (start, curr, sum) => {
                                if (result) return;
                                if (sum === target && curr.length > 0) { result = [...curr]; return; }
                                if (sum > target) return;
                                for (let i = start; i < arr.length; i++) {
                                    curr.push(arr[i]);
                                    search(i + 1, curr, sum + arr[i].value);
                                    curr.pop();
                                }
                            };
                            search(0, [], 0);
                            return result;
                        };
                        captured = findSubset(table, card.value) || [];
                    }

                    const newHand = p.cards.filter((_, cIdx) => cIdx !== action.cardIndex);
                    let isScopa = false;
                    let msg = '';

                    if (captured.length > 0) {
                        const capUids = captured.map(c => c.uid);
                        table = table.filter(tc => !capUids.includes(tc.uid));
                        if (table.length === 0 && (current.deck.length > 0 || current.players.some((pl, i) => (i === idx ? newHand.length > 0 : pl.cards.length > 0)))) {
                            isScopa = true;
                        }
                        msg = isScopa
                            ? `🧹 SCOPA DI ${p.name.toUpperCase()}! (+1 Punto!)`
                            : `${p.name} prende ${captured.map(c => c.rank + c.symbol).join(' + ')} con ${card.rank}${card.symbol}!`;
                    } else {
                        table.push(card);
                        msg = `${p.name} cala ${card.rank}${card.symbol} sul tavolo.`;
                    }

                    let deck = [...current.deck];
                    let updatedPlayers = current.players.map((pl, i) => {
                        if (i !== idx) return pl;
                        return {
                            ...pl,
                            cards: newHand,
                            capturedCards: captured.length > 0 ? [...pl.capturedCards, card, ...captured] : pl.capturedCards,
                            scopaCount: isScopa ? (pl.scopaCount || 0) + 1 : pl.scopaCount
                        };
                    });

                    let lastCapturerIdx = captured.length > 0 ? idx : (current.lastCapturerIdx ?? idx);

                    if (updatedPlayers.every(pl => pl.cards.length === 0)) {
                        if (deck.length > 0) {
                            updatedPlayers = updatedPlayers.map(pl => ({
                                ...pl,
                                cards: deck.splice(0, 3)
                            }));
                            msg += ' • Nuove 3 carte servite!';
                        } else {
                            if (table.length > 0) {
                                updatedPlayers[lastCapturerIdx].capturedCards = [
                                    ...updatedPlayers[lastCapturerIdx].capturedCards,
                                    ...table
                                ];
                                table = [];
                            }
                            const breakdown = computeScopaBreakdown(updatedPlayers);
                            const summaryText = breakdown.map(b => `${b.name}: ${b.finalTotal} pt (Carte:${b.totalCards}, Denari:${b.denariCount}, Scope:${b.scope})`).join(' | ');
                            broadcastState({
                                ...current,
                                deck: [],
                                communityCards: [],
                                players: updatedPlayers.map((pl, i) => ({ ...pl, scorePoints: breakdown[i]?.finalTotal || 0 })),
                                phase: 'SHOWDOWN',
                                notification: `🏆 Fine Scopa! ${summaryText}`
                            });
                            return;
                        }
                    }

                    const nextTurn = (idx + 1) % updatedPlayers.length;
